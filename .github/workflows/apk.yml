name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i -g @bubblewrap/cli
      - name: Bubblewrap config
        run: |
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json
      - name: Make signing key
        run: keytool -genkeypair -v -keystore android.keystore -alias backflow -storepass backflow1 -keypass backflow1 -dname "CN=Colin Bell Plumbing" -keyalg RSA -keysize 2048 -validity 10000
      - name: Build
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: backflow1
          BUBBLEWRAP_KEY_PASSWORD: backflow1
        run: yes | bubblewrap build --skipPwaValidation
      - uses: actions/upload-artifact@v4
        with:
          name: backflow-apk
          path: app-release-signed.apk
