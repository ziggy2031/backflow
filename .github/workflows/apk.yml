name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - name: Accept Android licences
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
      - name: Link SDK tools for Bubblewrap
        run: sudo ln -sfn $ANDROID_HOME/cmdline-tools/latest $ANDROID_HOME/tools
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i -g @bubblewrap/cli
      - name: Bubblewrap config
        run: |
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > android.keystore
      - name: Build
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: backflow1
          BUBBLEWRAP_KEY_PASSWORD: backflow1
        run: yes | bubblewrap build --skipPwaValidation
      - name: Show signing fingerprint
        run: |
          AS=$(ls -d $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          $AS verify --print-certs app-release-signed.apk | grep -i "SHA-256"
      - uses: actions/upload-artifact@v4
        with:
          name: backflow-apk
          path: app-release-signed.apk
